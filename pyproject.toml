[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-owlet-cam"
version = "0.9.2"
description = "Home Assistant custom integration for Owlet cameras"
readme = "README.md"
# This constrains the local/CI test toolchain, not HACS installation. The
# integration's minimum Home Assistant release is declared in hacs.json.
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "ha-owlet-cam contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
  "ha-ffmpeg==3.2.2",
  "homeassistant>=2024.11.0",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "pytest-homeassistant-custom-component>=0.13.264",
  "PyTurboJPEG==1.8.3",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/owlet_cam"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=custom_components.owlet_cam --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PT", "RUF", "S", "T20", "UP"]
ignore = [
  "ANN401",
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG", "D", "PLR2004", "S101", "SLF001"]
"scripts/*" = ["S603", "S607", "T201"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["haffmpeg.*", "homeassistant.*", "voluptuous"]
ignore_missing_imports = true
follow_imports = "skip"
