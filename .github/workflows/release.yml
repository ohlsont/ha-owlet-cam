name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy custom_components scripts
      - run: uv run pytest
      - run: uv run python scripts/validate_release.py
      - run: uv run python scripts/check_secrets.py
      - name: Verify tag matches manifest
        run: >-
          uv run python -c "import json,os;
          v=json.load(open('custom_components/owlet_cam/manifest.json'))['version'];
          tag=os.environ['GITHUB_REF_NAME'];
          assert tag == 'v'+v, (tag,v)"
      - name: Build HACS archive
        run: >-
          git archive --format=zip --output=ha-owlet-cam.zip HEAD
          custom_components/owlet_cam hacs.json LICENSE README.md SECURITY.md
          CHANGELOG.md TEST_REPORT.md REFERENCE_VERSIONS.md
      - name: Inspect archive
        run: unzip -l ha-owlet-cam.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: ha-owlet-cam.zip
          generate_release_notes: true
