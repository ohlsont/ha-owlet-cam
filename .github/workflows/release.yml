name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy custom_components scripts
      - run: uv run pytest
      - run: uv run python scripts/validate_release.py
      - run: uv run python scripts/check_secrets.py
      - name: Verify tag matches manifest
        run: >-
          uv run python -c "import json,os;
          v=json.load(open('custom_components/owlet_cam/manifest.json'))['version'];
          tag=os.environ['GITHUB_REF_NAME'];
          assert tag == 'v'+v, (tag,v)"
      - name: Build HACS archive
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/ha-owlet-cam.zip HEAD \
            custom_components/owlet_cam hacs.json LICENSE README.md SECURITY.md \
            CHANGELOG.md TEST_REPORT.md REFERENCE_VERSIONS.md
      - name: Build reproducible proprietary-free AArch64 helper
        run: |
          docker run --rm --network=bridge \
            -e HELPER_VERSION="${GITHUB_REF_NAME#v}" \
            -v "$PWD:/source:ro" \
            -v "$PWD/dist:/output" \
            debian@sha256:1710bde34461551a19a47c787885ec9ad7058d9a5bead2affb8d088fa2f8502b \
            /bin/sh /source/scripts/build_arm64_helper_in_container.sh
      - name: Create release metadata and notes
        run: |
          uv run python scripts/create_release_metadata.py \
            --version "${GITHUB_REF_NAME#v}" \
            --output-directory dist \
            dist/ha-owlet-cam.zip dist/owlet-cam-helper-aarch64.tar.gz
          uv run python scripts/extract_release_notes.py \
            --version "${GITHUB_REF_NAME#v}" \
            --output dist/release-notes.md
      - name: Inspect release archives
        run: >-
          uv run python scripts/inspect_release_assets.py
          dist/ha-owlet-cam.zip dist/owlet-cam-helper-aarch64.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/ha-owlet-cam.zip
            dist/owlet-cam-helper-aarch64.tar.gz
            dist/checksums.txt
            dist/sbom.spdx.json
            dist/license-manifest.json
