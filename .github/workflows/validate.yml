name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hacs:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          repository: ${{ github.repository }}

  hacs-private-readiness:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record public-only HACS gate
        run: >-
          echo 'HACS Action is intentionally deferred while this repository is
          private; it remains configured as a required public-repository gate.'

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy custom_components scripts
      - run: uv run python scripts/validate_release.py
      - run: uv run python scripts/check_secrets.py
      - name: Validate JSON
        run: >-
          uv run python -c "import json,pathlib;
          [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json')];
          print('JSON valid')"
