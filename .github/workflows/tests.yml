name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant: [stable, beta]
    name: Pytest (Home Assistant ${{ matrix.home-assistant }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --all-groups
      - name: Install Home Assistant beta
        if: matrix.home-assistant == 'beta'
        run: >-
          uv pip install --upgrade --prerelease=allow
          homeassistant pytest-homeassistant-custom-component
      - run: uv run pytest --cov-report=xml
      - name: Archive and secret regression suites
        if: matrix.home-assistant == 'stable'
        run: >-
          uv run pytest --no-cov
          tests/test_apk.py tests/test_release_assets.py tests/test_diagnostics.py
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.home-assistant == 'stable'
        with:
          name: coverage-stable
          path: coverage.xml
